spring:
  datasource:
    url: ${BANKING_DB_URL}
    username: ${BANKING_DB_USERNAME}
    password: ${BANKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    tr.com.huseyinaydin: INFO
    org.hibernate.SQL: ERROR

cors:
  allowed-origins: "https://banking.huseyinaydin.com.tr"
