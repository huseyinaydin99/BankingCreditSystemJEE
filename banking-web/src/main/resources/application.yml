spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${BANKING_DB_URL:jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${BANKING_DB_USERNAME:sa}
    password: ${BANKING_DB_PASSWORD:password}
  mail:
    password: ${BANKING_SMTP_PASSWORD:secret}

banking:
  security:
    token-options:
      audience: "banking-api"
      issuer: "banking-system"
      accessTokenExpiration: 15
      refreshTokenExpiration: 1440
      securityKey: ${BANKING_JWT_SECRET_KEY:ThisIsAVerySecretDefaultKeyForDevOnly123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
